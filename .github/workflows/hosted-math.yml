name: Hosted mathematics

on:
  pull_request:
    paths:
      - '**.md'
      - 'verification/hosted_math/**'
      - '.github/workflows/hosted-math.yml'

permissions:
  contents: read

concurrency:
  group: hosted-math-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CAPTURE_REVISION: fc7aa3237f42d6177480534d8aef8c42c23494f6
    steps:
      - name: Check out the validation helper source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check out the exact merged scientific source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CAPTURE_REVISION }}
          path: checked-source
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install the capture runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/math-runtime" playwright@1.56.1 mathjax-full@3.2.1
          node "$RUNNER_TEMP/math-runtime/node_modules/playwright/cli.js" install chromium
      - name: Probe inline display and table mathematics
        run: |
          export NODE_PATH="$RUNNER_TEMP/math-runtime/node_modules"
          node verification/hosted_math/probe_hosted_math.cjs --root "$GITHUB_WORKSPACE/checked-source" --repository "$GITHUB_REPOSITORY" --revision "$CAPTURE_REVISION" --page README.md --output "$RUNNER_TEMP/hosted-probe-readme"
          node verification/hosted_math/probe_hosted_math.cjs --root "$GITHUB_WORKSPACE/checked-source" --repository "$GITHUB_REPOSITORY" --revision "$CAPTURE_REVISION" --page science/noisy_meter_quantile.md --output "$RUNNER_TEMP/hosted-probe-inefficiency"
      - name: Compare every hosted mathematical expression
        if: ${{ !cancelled() }}
        run: |
          export NODE_PATH="$RUNNER_TEMP/math-runtime/node_modules"
          node verification/hosted_math/capture_hosted_math.cjs --root "$GITHUB_WORKSPACE/checked-source" --repository "$GITHUB_REPOSITORY" --revision "$CAPTURE_REVISION" --output "$RUNNER_TEMP/hosted-math"
      - name: Retain the actual captures and comparison reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-math-${{ env.CAPTURE_REVISION }}
          path: |
            ${{ runner.temp }}/hosted-math
            ${{ runner.temp }}/hosted-probe-readme
            ${{ runner.temp }}/hosted-probe-inefficiency
          if-no-files-found: error
          retention-days: 14
